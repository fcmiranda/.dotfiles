# Matchmaker Agent Worktree Prompt Input Preset (mm -o awt-prompt)

[tui]
percentage = 15
min = 3
max = 4

[ui]
nav_mode = false

[query]
status_inline = true
prompt = "> "
prompt_style.fg = "cyan"
prompt_style.modifier = "BOLD"

[footer]
content = " {cyan,bold:[Enter]} {darkgray:Confirm}  •  {yellow,bold:[Esc]} {darkgray:Back}"
row_connection = "Full"
style.fg = "gray"
style.modifier = "DIM"

[exit]
allow_empty = true

[start]
ansi = true
mode = "standard"
output_template = "{=query}"

[start.command]
command = "echo ''"

[binds]
"enter" = "Accept"
"esc" = "Quit"
