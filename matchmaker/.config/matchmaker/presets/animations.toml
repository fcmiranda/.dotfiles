[ui]
nav_mode = true
nav_bar = "Plain"
nav_color = "Cyan"

[tui]
percentage = 80
min = 15
max = 100

[results]
wrap = false

[results.style]
fg = "White"

[results.current_style]
fg = "Cyan"
modifier = "BOLD"

[preview]
show = true
wrap = true

[preview.border]
title_fg = "Cyan"
color = "Blue"
type = "Rounded"

[[preview.layout]]
command = "if [ -f {2} ]; then cp {2} ~/.config/hypr/animations.conf 2>/dev/null && hyprctl reload >/dev/null 2>&1; bat --paging=never --style=header,grid,numbers --color=always {2} 2>/dev/null || cat {2}; fi"
side = "right"
percentage = 50
min = 25

[columns]
split = "\t"
names = [
  "label",
  { name = "path", hidden = true }
]

[start.command]
cmd = '''
{
  find -L "$HOME/.config/hypr/animations/" -maxdepth 1 -type f -name '*.conf' 2>/dev/null | sort
} | awk '{ fullpath = $0; filename = fullpath; sub(/.*\//, "", filename); label = filename; sub(/\.conf$/, "", label); sub(/^[0-9]+-?/, "", label); gsub(/-/, " ", label); n = split(label, words, " "); label = ""; for (i = 1; i <= n; i++) { word = words[i]; word = toupper(substr(word, 1, 1)) substr(word, 2); label = label (i > 1 ? " " : "") word }; print label "\t" fullpath }'
'''

[query]
prompt = " Hyprland Animations > "

[start]
mode = "nav"
additional_commands = []

[binds]
"ctrl-j" = "Down"
"ctrl-k" = "Up"
"nav^^g" = "Pos(0)"
"nav^^G" = "Pos(-1)"
"nav^^q" = "Quit"
"nav^^esc" = "Quit"
"nav^^enter" = "Accept"
