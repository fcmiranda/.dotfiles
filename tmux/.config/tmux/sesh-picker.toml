[ui]
nav_mode = true
nav_basic = true
nav_bar = "Plain"
nav_color = "Black"
nav_prompt = ""

[start]
sort = false
ansi = true
command = "sesh list --icons"

[tui]
percentage = 100
max = 9999

[matcher]
sort_threshold = false

[ui.border]
sides = ""

[query]
prompt = "⚡ "
status_inline = true

[footer]
content = " {cyan,bold:[Enter]} {darkgray:Connect}  •  {red,bold:[d]} {darkgray:Kill}  •  {yellow,bold:[a]} {darkgray:All}  •  {magenta,bold:[t]} {darkgray:Tmux}  •  {blue,bold:[x]} {darkgray:Frecency}"
row_connection = "Full"
match_indent = false

[results]
spinner_inline = true
current_prefix = " "
unselected_prefix = "  "
row_connection = "Disjoint"
column_spacing = 1

[results.border]
sides = ""

[previewer]
debounce_ms = 20
delay_clear = true

[preview]
wrap = false

[preview.border]
sides = "LEFT"
color = "Gray"

[[preview.layout]]
command = 'sesh preview {=}'
side = "right"
percentage = 55

[binds]
"ctrl-a" = [ "SetPrompt(⚡  )", "Reload(sesh list --icons)" ]
"ctrl-t" = [ "SetPrompt(🪟  )", "Reload(sesh list -t --icons)" ]
"ctrl-g" = [ "SetPrompt(⚙️  )", "Reload(sesh list -c --icons)" ]
"ctrl-x" = [ "SetPrompt(📁  )", "Reload(mm list --dirs)" ]
"ctrl-f" = [ "SetPrompt(🔎  )", "Reload(fd -H -d 2 -t d -E .Trash . ~)" ]
"ctrl-d" = [ 'ExecuteAsync(sess="{=}"; sess="${sess#* }"; tmux kill-session -t "$sess")', "SetPrompt(⚡  )", "SetQuery()", "Reload(sesh list --icons)" ]
"nav^^a" = [ "SetPrompt(⚡  )", "Reload(sesh list --icons)" ]
"nav^^t" = [ "SetPrompt(🪟  )", "Reload(sesh list -t --icons)" ]
"nav^^g" = [ "SetPrompt(⚙️  )", "Reload(sesh list -c --icons)" ]
"nav^^x" = [ "SetPrompt(📁  )", "Reload(mm list --dirs)" ]
"nav^^f" = [ "SetPrompt(🔎  )", "Reload(fd -H -d 2 -t d -E .Trash . ~)" ]
"nav^^d" = [ 'ExecuteAsync(sess="{=}"; sess="${sess#* }"; tmux kill-session -t "$sess")', "SetPrompt(⚡  )", "SetQuery()", "Reload(sesh list --icons)" ]
