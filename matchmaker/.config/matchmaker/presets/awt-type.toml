# Matchmaker Agent Worktree Conventional Type Preset (`mm -o awt-type`)

[tui]
percentage = 100
min = 12
max = 9999

[ui]
nav_mode = true
nav_bar = "Plain"
nav_color = "white"

[ui.parent_peek]
enabled = false

[query]
status_inline = true
prompt = "> "
prompt_style.fg = "white"
prompt_style.modifier = "BOLD"

[footer]
content = " {cyan,bold:[Enter]} {darkgray:Select Type}  •  {darkgray,bold:[Esc/q]} {darkgray:Cancel}"
row_connection = "Full"
match_indent = false
style.fg = "gray"
style.modifier = "DIM"

[matcher]
sort = "smart"
typo_tolerance = true

[results]
reverse = false
column_spacing = 2
symlink_target = false

[results.current_style]
bg = "darkgray"
modifier = "BOLD"

[results.current_nav_bar_style]
fg = "cyan"
modifier = "BOLD"

[columns]
split = "\t"
default = "type"
names = [
    { name = "icon" },
    { name = "type" },
    { name = "prefix", hidden = true },
    { name = "description" },
]

[preview]
show = false

[start.command]
command = '''
printf "✨\t\033[1;36mfeat\033[0m\tfeat/\tNew feature\n\
🐛\t\033[1;31mfix\033[0m\tfix/\tBug fix\n\
♻️\t\033[1;33mrefactor\033[0m\trefactor/\tCode restructuring\n\
⚡\t\033[1;35mperf\033[0m\tperf/\tPerformance optimization\n\
🔧\t\033[1;34mchore\033[0m\tchore/\tMaintenance / config\n\
📝\t\033[1;32mdocs\033[0m\tdocs/\tDocumentation\n\
🧪\t\033[1;36mtest\033[0m\ttest/\tTest suites\n\
📦\t\033[1;33mbuild\033[0m\tbuild/\tDependencies / build\n\
🏷️\t\033[2mcustom\033[0m\t\tNo prefix / freeform\n"
'''

[start]
ansi = true
mode = "nav"
output_template = "{=icon}\t{=prefix}"

[binds]
"ctrl-j" = "Down"
"ctrl-k" = "Up"
"nav^^j" = "Down"
"nav^^k" = "Up"
"nav^^down" = "Down"
"nav^^up" = "Up"
"nav^^enter" = "Accept"
"nav^^q" = "Quit"
"nav^^esc" = "Quit"
"nav^^g" = "Pos(0)"
"nav^^G" = "Pos(-1)"
