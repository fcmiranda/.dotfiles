[ui]
nav_mode = true
nav_bar = "Plain"
nav_color = "Cyan"

[tui]
percentage = 80
min = 10
max = 100

[preview]
show = true
wrap = true

[preview.border]
title_fg = "Cyan"
color = "Blue"
type = "Rounded"

[[preview.layout]]
command = "if [ -f {2} ]; then cp {2} ~/.config/hypr/animations.conf 2>/dev/null && hyprctl reload >/dev/null 2>&1; bat --paging=never --style=header,grid,numbers --color=always {2} 2>/dev/null || cat {2}; fi"
side = "right"
percentage = 65

[columns]
split = "\t"
names = [
  "label",
  { name = "path", hidden = true }
]

[start.command]
separator = "\n"
cmd = '''
ANIM_DIR="$HOME/.config/hypr/animations"
mkdir -p "$ANIM_DIR"
for file in "$ANIM_DIR"/*.conf; do
  [ -f "$file" ] || continue
  filename=$(basename "$file")
  title=$(head -n 1 "$file" | sed 's/^# //')
  [ -z "$title" ] && title="$filename"
  printf "%s\t%s\n" "$title" "$file"
done
'''

[query]
prompt = "Hyprland Animations > "
prompt_style.fg = "Cyan"

[start]
mode = "nav"
input_separator = "\n"
output_separator = "\n"

[binds]
"ctrl-j" = "Down"
"ctrl-k" = "Up"
"enter" = "Accept"
"esc" = "Quit"
"q" = "Quit"
"nav^^enter" = "Accept"
"nav^^q" = "Quit"
"nav^^esc" = "Quit"
