[ui]
nav_mode = true
nav_bar = "Plain"
nav_color = "Magenta"

[tui]
percentage = 80
min = 10
max = 100

[preview]
show = true
wrap = true

[preview.border]
title_fg = "Magenta"
color = "Cyan"
type = "Rounded"

[previewer]
debounce_ms = 15
delay_clear = true

[[preview.layout]]
command = "hypr-border-preview {2}"
side = "right"
percentage = 60

[columns]
split = "\t"
names = [
  "label",
  { name = "path", hidden = true }
]

[start.command]
cmd = '''
BORDERS_DIR="$HOME/.config/hypr/borders"
for file in $BORDERS_DIR/*.lua.tpl; do
  [ -f "$file" ] || continue
  read -r title < "$file" || true
  title="${title#--}"
  title="${title#\#}"
  title="${title# }"
  [ -z "$title" ] && title="${file##*/}"
  printf "%s\t%s\n" "$title" "$file"
done
'''

[query]
prompt = " 🌈 Hyprland Border Styles > "

[start]
mode = "nav"
additional_commands = []

[binds]
"ctrl-j" = "Down"
"ctrl-k" = "Up"
"nav^^g" = "Pos(0)"
"nav^^G" = "Pos(-1)"
"nav^^q" = "Quit"
"nav^^esc" = "Quit"
"nav^^enter" = "Accept"
