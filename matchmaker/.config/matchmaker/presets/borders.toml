[ui]
nav_mode = true
nav_bar = "Plain"
nav_color = "Magenta"

[tui]
percentage = 60
min = 15
max = 80

[preview]
show = true
wrap = false

[preview.border]
title_fg = "Magenta"
color = "Cyan"
type = "Rounded"

[previewer]
debounce_ms = 10
delay_clear = false

[[preview.layout]]
command = "hypr-border-preview {2}"
side = "bottom"
percentage = 35

[columns]
split = "\t"
names = [
  "label",
  { name = "path", hidden = true }
]

[start.command]
cmd = '''
BORDERS_DIR="$HOME/.config/hypr/borders"
for file in $BORDERS_DIR/*.lua.tpl; do
  [ -f "$file" ] || continue
  read -r title < "$file" || true
  title="${title#--}"
  title="${title#\#}"
  title="${title# }"
  [ -z "$title" ] && title="${file##*/}"
  printf "%s\t%s\n" "$title" "$file"
done
'''

[query]
prompt = ">"
status_inline = true

[start]
mode = "nav"
additional_commands = []

[binds]
"ctrl-j" = "Down"
"ctrl-k" = "Up"
"up" = "Up"
"down" = "Down"
"right" = "Execute(hypr-border-control speed_up {2})"
"left" = "Execute(hypr-border-control speed_down {2})"
"l" = "Execute(hypr-border-control speed_up {2})"
"h" = "Execute(hypr-border-control speed_down {2})"
"+" = "Execute(hypr-border-control speed_up {2})"
"=" = "Execute(hypr-border-control speed_up {2})"
"-" = "Execute(hypr-border-control speed_down {2})"
"r" = "Execute(hypr-border-control rotate_angle {2})"
"nav^^g" = "Pos(0)"
"nav^^G" = "Pos(-1)"
"nav^^h" = "Execute(hypr-border-control speed_down {2})"
"nav^^l" = "Execute(hypr-border-control speed_up {2})"
"nav^^r" = "Execute(hypr-border-control rotate_angle {2})"
"nav^^+" = "Execute(hypr-border-control speed_up {2})"
"nav^^=" = "Execute(hypr-border-control speed_up {2})"
"nav^^-" = "Execute(hypr-border-control speed_down {2})"
"nav^^q" = "Quit"
"nav^^esc" = "Quit"
"nav^^enter" = "Accept"
