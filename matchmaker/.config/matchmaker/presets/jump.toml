[ui]
nav_mode = true
nav_bar = "Plain"
nav_color = "Black"

[matcher]
sort = "smart"
depth_penalty = 15
frecency = true
frecency_weight = 2
typo_tolerance = true
# Native directory prioritization: puts direct child subfolders at the top of the list
# for instant interactive navigation with 'l' and 'h' without needing multiple fd passes.
dir_first = true

[results]
reverse = false
icons = true
symlink_target = true
symlink_target_style.fg = "cyan"

[results.autoscroll]
indicator = ""
indicator_style.fg = "blue"

[previewer]
debounce_ms = 50
delay_clear = true

[preview]
media = true

[preview.border]
title_fg = "cyan"
color = "blue"
type = "Rounded"

[[preview.layout]]
command = "p={1}; p=\"${p/#\\~/$HOME}\"; if [ -d \"$p\" ]; then eza --tree --level=2 --icons --git-ignore --color=always \"$p\"; else bat --style=numbers --color=always --line-range=:300 \"$p\"; fi"
side = "right"
percentage = 80

[binds]
"@reloadnext" = "ReloadNext"
"ctrl-z" = "@reloadnext"
"ctrl-j" = "Down"
"ctrl-k" = "Up"

[ui.nav_binds]
"ctrl-z" = "@reloadnext"
"z" = "@reloadnext"
"l" = ["ChDir({=})", "@reload_local"]
"h" = ["ChDir(..)", "@reload_local"]

[breadcrumb]
show = true
separator = "/"
style.fg = "Cyan"
style.modifier = "BOLD"
separator_style.fg = "Cyan"
#current_folder_only = true
#truncate_length = 3
#width_pct = 80

[start]
# Alternative source commands cycled via @reloadnext (ctrl-z / z in nav_binds):
# Index 0: "" -> Resets back to the main start.command below.
# Index 1: Local file/dir search using fd.
# Index 2: Global frecency directory list from mm list --dirs.
additional_commands = [
    "",
    "fd -H -E.git -Enode_modules -E.cache -Etarget -Edist -Ebuild --strip-cwd-prefix . 2>/dev/null",
    "mm list --dirs 2>/dev/null | sed -E \"s#^$HOME(/|$)##\" | grep -v \"^$\""
]

# Default command executed on startup and re-executed upon directory change (ChDir / l / h)
[start.command]
command = '''
IGNORE="-E.git -Enode_modules -E.cache -Etarget -Edist -Ebuild -E__pycache__ -E.venv -Evenv -Eenv -Evendor -E.gradle -E.npm -E.pnpm-store -E.next -Eout -Ecoverage -E.tox -E.mypy_cache -E.pytest_cache -E.cargo -E.rustup -E.mozilla -E.thunderbird"

if command -v fd >/dev/null 2>&1; then
    fd -H $IGNORE --strip-cwd-prefix --min-depth 1 . 2>/dev/null
else
    find .
fi
'''