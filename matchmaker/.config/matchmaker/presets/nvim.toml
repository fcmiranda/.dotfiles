# Matchmaker Neovim File Picker Preset (`mm -o nvim`)
# Optimized for high-performance file searching, frecency scoring, and live preview inside Neovim float windows.

[tui]
percentage = 100
min = 10
max = 9999

[ui]
nav_mode = false

[ui.border]
sides = ""

[query]
prompt = " "
prompt_style.fg = "Cyan"
status_inline = true

[matcher]
sort = "smart"
sort_cap = 2000
depth_penalty = 15
frecency = true
frecency_weight = 2
typo_tolerance = true
dir_first = false

[results]
icons = true
reverse = false
current_prefix = " "
unselected_prefix = "  "
column_spacing = 1

[results.border]
sides = ""

[results.autoscroll]
indicator = ""
indicator_style.fg = "blue"

[previewer]
debounce_ms = 20
delay_clear = true

[preview]
show = true
wrap = true
scroll_wrap = true
media = true
media_protocol = "kitty"

[preview.border]
sides = "LEFT"
color = "Gray"

[[preview.layout]]
command = '''p={1}; p="${p/#\~/$HOME}"; if [ -d "$p" ]; then mm tree "$p" 2>/dev/null || eza --tree --level=2 --icons=always --git-ignore --color=always "$p" 2>/dev/null || ls -la "$p"; else mime=$(file -b --mime-type "$p" 2>/dev/null); if [[ "$mime" == image/* ]]; then if command -v chafa >/dev/null 2>&1; then chafa --format=symbols --symbols=vhalf+hhalf+quad+half+block --color-space=din99d "$p" 2>/dev/null; fi; else bat --style=numbers,changes --color=always --line-range=:300 "$p" 2>/dev/null || cat "$p"; fi; fi'''
side = "right"
percentage = 50

[start.command]
command = '''
if [ -d .git ]; then
    git ls-files --cached --others --exclude-standard 2>/dev/null || fd --type f --strip-cwd-prefix --hidden --exclude .git 2>/dev/null || find . -type f
elif command -v fd >/dev/null 2>&1; then
    fd --type f --strip-cwd-prefix --hidden --exclude .git 2>/dev/null
else
    find . -type f
fi
'''

[start]
ansi = false
additional_commands = [
    "",
    "mm list 2>/dev/null"
]

[binds]
"ctrl-c" = "Quit"
"esc" = "Quit"
"enter" = "@accept"
"ctrl-j" = "Down"
"ctrl-k" = "Up"
"ctrl-p" = "SwitchPreview"
"ctrl-f" = "ReloadNext"
"@accept" = "Accept"
