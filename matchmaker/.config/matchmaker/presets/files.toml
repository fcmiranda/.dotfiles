# Matchmaker Files Peek Preset (`mm -o files`)
# Optimized for quick inspection of workspace files and AI-generated content.
# Supports 60% Golden Ratio split and 95% Full-Modal preview toggle via Ctrl+P.
# Supports Ctrl+V to insert the file path directly into the origin pane/AI prompt.

[ui]
nav_mode = true
nav_focus_on_start = "filter"
nav_bar = "Plain"
nav_color = "Darkgray"
nav_hints = true
nav_hints_columns = 4

[tui]
percentage = 100
max = 9999

[query]
prompt = "> "
prompt_style.fg = "Cyan"
status_inline = true

[matcher]
sort = "smart"
sort_cap = 2000
depth_penalty = 15
frecency = true
frecency_weight = 2
typo_tolerance = true
dir_first = true

[results]
icons = true
scroll_wrap = true
row_connection = "Full"
tier_separator = "Underline"

[results.tier_separator_style]
fg = "#555555"

[results.current_style]
fg = "black"
bg = "Darkgray"
modifier = "BOLD"

[results.current_nav_bar_style]
fg = "white"

[previewer]
debounce_ms = 40
delay_clear = true

[preview]
show = true
wrap = true
scrollbar = true
media = true
media_fit = "fit"
markdown = true
diagrams = true
inline_diagrams = true
diagram_theme = "auto"
diagram_background = "transparent"

# Layout 0: Standard split (60% preview, 40% list)
[[preview.layout]]
side = "right"
percentage = 60

# Layout 1: Exclusive Fullscreen Preview (100% modal for preview, list hidden)
[[preview.layout]]
side = "right"
percentage = 100

# Layout 2: Overrides and disables the 3rd layout from base config (strictly toggles 60% <-> 100%)
[[preview.layout]]
max = 0

[preview.border]
sides = "LEFT"
color = "Gray"

[footer]
content = " {cyan,bold:[enter]} {darkgray:fullscreen} {cyan,bold:[C-v]} {darkgray:insert} {cyan,bold:[J/K]} {darkgray:preview} {cyan,bold:[s]} {darkgray:diagram} {cyan,bold:[C-e]} {darkgray:edit} {cyan,bold:[C-y]} {darkgray:copy}"
match_indent = false
row_connection = "Full"

[exit]
abort_empty = true

[binds]
enter = "CyclePreview"
esc = "ToggleFocus"
ctrl-c = "Quit"
ctrl-j = "Down"
ctrl-k = "Up"
ctrl-shift-j = "PreviewDown(5)"
ctrl-shift-k = "PreviewUp(5)"
ctrl-J = "PreviewDown(5)"
ctrl-K = "PreviewUp(5)"
ctrl-y = "Accept"
ctrl-d = "PreviewHalfPageDown"
ctrl-u = "PreviewHalfPageUp"
ctrl-s = "ToggleDiagram"
tab = "ToggleFocus"
ctrl-i = "ToggleFocus"
ctrl-v = 'ExecuteSilent(test -n "$MM_ORIGIN_PANE" && tmux send-keys -t "$MM_ORIGIN_PANE" -l -- {})'
ctrl-e = 'Execute(~/.config/tmux/scrollback-open.sh {} "$MM_ORIGIN_CWD")'
ctrl-l = ["ChDir({=})", "Cancel", "Reload", "Pos(0)"]
ctrl-h = ["ChDir(..)", "Cancel", "Reload"]

[ui.nav_binds]
enter = "CyclePreview"
esc = "Quit"
q = "Quit"
"/" = "FocusFilter"
ctrl-c = "Quit"
ctrl-v = 'ExecuteSilent(test -n "$MM_ORIGIN_PANE" && tmux send-keys -t "$MM_ORIGIN_PANE" -l -- {})'
j = "Down"
k = "Up"
up = "Up"
down = "Down"
left = "PreviewHScroll(-6)"
right = "PreviewHScroll(6)"
ctrl-j = "Down"
ctrl-k = "Up"
ctrl-shift-j = "PreviewDown(5)"
ctrl-shift-k = "PreviewUp(5)"
ctrl-J = "PreviewDown(5)"
ctrl-K = "PreviewUp(5)"
J = "PreviewDown(5)"
K = "PreviewUp(5)"
shift-j = "PreviewDown(5)"
shift-k = "PreviewUp(5)"
d = "PreviewHalfPageDown"
ctrl-d = "PreviewHalfPageDown"
u = "PreviewHalfPageUp"
ctrl-u = "PreviewHalfPageUp"
s = "ToggleDiagram"
ctrl-s = "ToggleDiagram"
"n" = "NextDiagram"
"N" = "PrevDiagram"
"]" = "NextDiagram"
"[" = "PrevDiagram"
"+" = "DiagramZoomIn"
"=" = "DiagramZoomIn"
"-" = "DiagramZoomOut"
"0" = "DiagramResetZoom"
" " = "Toggle"
tab = "ToggleFocus"
ctrl-i = "ToggleFocus"
e = 'Execute(~/.config/tmux/scrollback-open.sh {} "$MM_ORIGIN_CWD")'
l = ["ChDir({=})", "Cancel", "Reload", "Pos(0)"]
h = ["ChDir(..)", "Cancel", "Reload"]
