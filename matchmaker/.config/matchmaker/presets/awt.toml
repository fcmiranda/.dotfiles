# Matchmaker Agent Worktree Preset (`mm -o awt`)
# Interactive worktree switcher with Nav Mode, BASE column, ANSI colors, and native Conventional Branch wizard.

[tui]
percentage = 80
min = 15
max = 90

[ui]
nav_mode = true
nav_bar = "Plain"
nav_color = "white"

[ui.parent_peek]
enabled = false

[query]
status_inline = true
prompt = ">"
prompt_style.fg = "white"
prompt_style.modifier = "BOLD"

[header]
header_lines = 1
style.fg = "Cyan"
style.modifier = "BOLD"

[footer]
content = " {cyan,bold:[Enter]} {darkgray:Connect Sesh}  •  {yellow,bold:[c]} {darkgray:New WT}  •  {red,bold:[d]} {darkgray:Delete}  •  {blue,bold:[p]} {darkgray:Preview}  •  {darkgray,bold:[q]} {darkgray:Quit}"
row_connection = "Full"
match_indent = false
style.fg = "gray"
style.modifier = "DIM"

[matcher]
sort = "smart"
typo_tolerance = true

[results]
reverse = false
column_spacing = 2
symlink_target = false

[results.current_style]
fg = "black"
bg = "lightblue"
modifier = "BOLD"

[results.current_nav_bar_style]
fg = "lightblue"

[columns]
split = "\t"
default = "branch"
names = [
    { name = "branch" },
    { name = "base" },
    { name = "status" },
    { name = "main" },
    { name = "remote" },
    { name = "age" },
    { name = "commit" },
    { name = "path", hidden = true },
]

[previewer]
debounce_ms = 20
delay_clear = true

[preview]
show = false

# ── Preview Layout 1: Status & Local Changes + Recent Commits ──
[[preview.layout]]
command = '''
wt_path="{=path}"
wt_path="${wt_path/#\~/$HOME}"
if [ -d "$wt_path" ]; then
    echo "━━━ Git Status & Local Changes ━━━━━━━━━━━━━━━━━━━━━━━"
    git -C "$wt_path" status -s --branch 2>/dev/null
    echo ""
    echo "━━━ Recent Commits ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    git -C "$wt_path" log --oneline --graph --color=always -n 8 2>/dev/null
fi
'''
side = "right"
percentage = 55

# ── Preview Layout 2: Diff vs Main (Merge Base) ──
[[preview.layout]]
command = '''
wt_path="{=path}"
wt_path="${wt_path/#\~/$HOME}"
if [ -d "$wt_path" ]; then
    echo "━━━ Diff vs main (Merge Base) ━━━━━━━━━━━━━━━━━━━━━━━━"
    git -C "$wt_path" diff --color=always main...HEAD 2>/dev/null | head -n 120
fi
'''
side = "right"
percentage = 55

# ── Preview Layout 3: Commit History & Stats ──
[[preview.layout]]
command = '''
wt_path="{=path}"
wt_path="${wt_path/#\~/$HOME}"
if [ -d "$wt_path" ]; then
    echo "━━━ Commit History & Statistics ━━━━━━━━━━━━━━━━━━━━━━"
    git -C "$wt_path" log --stat --color=always -n 5 2>/dev/null
fi
'''
side = "right"
percentage = 55

[start.command]
command = '''
main_branch="main"
current_wt=$(git rev-parse --show-toplevel 2>/dev/null)

# Header line (consumed by header_lines = 1)
printf "BRANCH\tBASE\tSTATUS\tMAIN ↕\tREMOTE ⇅\tAGE\tCOMMIT\tPATH\n"

git worktree list --porcelain 2>/dev/null | awk '
/^worktree / { if (path && !bare) printf "%s\t%s\t%s\n", path, (branch ? branch : head), head; path = substr($0, 10); branch = ""; head = ""; bare = 0 }
/^bare$/     { bare = 1 }
/^HEAD /     { head = substr($0, 6, 7) }
/^branch /   { branch = substr($0, 8); sub("refs/heads/", "", branch) }
END          { if (path && !bare) printf "%s\t%s\t%s\n", path, (branch ? branch : head), head }
' | while IFS=$'\t' read -r wt_path branch head; do
    # Marker & Branch formatting with colors
    if [[ "$wt_path" == "$current_wt" ]]; then
        branch_display="\033[1;36m@ $branch\033[0m"
    elif [[ "$branch" == "$main_branch" ]]; then
        branch_display="\033[1;33m^ $branch\033[0m"
    else
        branch_display="  $branch"
    fi

    # Base branch detection
    base_branch=$(git -C "$wt_path" config "branch.${branch}.base" 2>/dev/null)
    if [[ -z "$base_branch" ]]; then
        if [[ "$branch" == "$main_branch" ]]; then
            base_display="\033[2m-\033[0m"
        else
            base_display="\033[35m$main_branch\033[0m"
        fi
    else
        base_display="\033[35m$base_branch\033[0m"
    fi

    # Dirty / Clean status with colors
    dirty_count=$(git -C "$wt_path" status --porcelain 2>/dev/null | wc -l)
    if [[ "$dirty_count" -gt 0 ]]; then
        status_icon="\033[1;33m?\033[0m \033[1;31m✗\033[0m \033[31m(+${dirty_count})\033[0m"
    else
        status_icon="\033[1;32m✔\033[0m"
    fi

    # Main divergence (Ahead / Behind) with colored arrows
    counts=$(git -C "$wt_path" rev-list --left-right --count "${main_branch}...HEAD" 2>/dev/null)
    behind=$(echo "$counts" | awk '{print $1}')
    ahead=$(echo "$counts" | awk '{print $2}')
    if [[ -z "$counts" ]]; then
        main_div="\033[2m-\033[0m"
    elif [[ "$ahead" -eq 0 && "$behind" -eq 0 ]]; then
        main_div="\033[32mSynced\033[0m"
    else
        main_div=""
        [[ "$ahead" -gt 0 ]] && main_div+="\033[1;32m↑${ahead}\033[0m "
        [[ "$behind" -gt 0 ]] && main_div+="\033[1;31m↓${behind}\033[0m"
        main_div="${main_div% }"
    fi

    # Remote upstream divergence with colored arrows
    upstream_div="\033[2m-\033[0m"
    if git -C "$wt_path" rev-parse --abbrev-ref '@{u}' >/dev/null 2>&1; then
        u_counts=$(git -C "$wt_path" rev-list --left-right --count '@{u}...HEAD' 2>/dev/null)
        u_behind=$(echo "$u_counts" | awk '{print $1}')
        u_ahead=$(echo "$u_counts" | awk '{print $2}')
        if [[ "$u_ahead" -eq 0 && "$u_behind" -eq 0 ]]; then
            upstream_div="\033[32mSynced\033[0m"
        else
            upstream_div=""
            [[ "$u_ahead" -gt 0 ]] && upstream_div+="\033[1;32m⇡${u_ahead}\033[0m "
            [[ "$u_behind" -gt 0 ]] && upstream_div+="\033[1;31m⇣${u_behind}\033[0m"
            upstream_div="${upstream_div% }"
        fi
    fi

    # Age & Commit hash
    age=$(git -C "$wt_path" log -1 --format="%cr" 2>/dev/null | sed "s/ ago//; s/ minutes/m/; s/ hours/h/; s/ days/d/; s/ weeks/w/")
    age_display="\033[2m${age:-now}\033[0m"
    head_display="\033[33m$head\033[0m"

    printf "%b\t%b\t%b\t%b\t%b\t%b\t%b\t%s\n" \
        "$branch_display" "$base_display" "$status_icon" "$main_div" "$upstream_div" "$age_display" "$head_display" "$wt_path"
done
'''

[start]
ansi = true
mode = "nav"
output_template = "{=path}"

[binds]
# Standard & fallback keys
"ctrl-j" = "Down"
"ctrl-k" = "Up"
"ctrl-p" = "SwitchPreview"

"ctrl-n" = '''Execute(
    selected_raw="{=branch}"
    selected_branch=$(echo "$selected_raw" | sed 's/^[ @^]*//; s/ .*//')

    # 1. Type selection via Matchmaker
    type_chosen=$(printf "feat\t✨ New feature\nfix\t🐛 Bug fix\nrefactor\t♻️  Code refactoring\nperf\t⚡ Performance optimization\nchore\t🔧 Maintenance & config\ndocs\t📝 Documentation\ntest\t🧪 Tests\nbuild\t📦 Build & dependencies\ncustom\t🏷️  Freeform / No prefix\n" | \
        mm d "\t" o "{1}" q.prompt="Type > " tui.percentage=30 ui.border.type=Rounded 2>/dev/null </dev/tty)
    [ -n "$type_chosen" ] || exit 0

    if [[ "$type_chosen" == "custom" ]]; then
        prefix=""
    else
        prefix="${type_chosen}/"
    fi

    # 2. Branch name / slug input
    printf "\033[1;36m🌿 Branch name (%s):\033[0m " "${prefix}<name>"
    read -r slug </dev/tty
    [ -n "$slug" ] || exit 0
    slug=$(echo "$slug" | tr ' ' '-' | tr '[:upper:]' '[:lower:]')
    branch_name="${prefix}${slug}"

    # 3. Base branch selection via Matchmaker
    main_branch="main"
    base_chosen=$({
        printf "main\t🌱 (Default Base)\n"
        [[ -n "$selected_branch" && "$selected_branch" != "$main_branch" ]] && printf "%s\t📌 (Selected Worktree)\n" "$selected_branch"
        git for-each-ref --format="%(refname:short)" refs/heads | grep -vE "^(HEAD|$main_branch|$selected_branch)$" | while read -r b; do
            printf "%s\t🌿 (Local Branch)\n" "$b"
        done
        git for-each-ref --format="%(refname:short)" refs/remotes/origin | grep -vE "(HEAD|$main_branch)" | while read -r r; do
            printf "%s\t☁️  (Remote Branch)\n" "$r"
        done
    } | mm d "\t" o "{1}" q.prompt="Base for '${branch_name}' > " tui.percentage=40 ui.border.type=Rounded 2>/dev/null </dev/tty)
    [ -n "$base_chosen" ] || exit 0

    # 4. Provision worktree & connect
    repo_root=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
    branch_folder="${branch_name//\//-}"
    target_dir="$repo_root/../$branch_folder"

    if command -v wt >/dev/null 2>&1; then
        wt switch --create "$branch_name" --base "$base_chosen"
    else
        git worktree add "$target_dir" -b "$branch_name" "$base_chosen"
    fi
    git -C "$target_dir" config "branch.${branch_name}.base" "$base_chosen" 2>/dev/null || true

    if command -v sesh >/dev/null 2>&1; then
        sesh connect "$target_dir"
    fi
)'''

"ctrl-d" = '''Execute(
    wt_p="{=path}"
    printf "Remove worktree %s? [y/N]: " "$wt_p"
    read -r ans </dev/tty
    case "$ans" in
        [yY]*) wt remove "$wt_p" 2>/dev/null || git worktree remove "$wt_p" ;;
        *) exit 0 ;;
    esac
)'''

"ctrl-u" = '''Execute(
    echo "Fetching remotes for {=branch}..."
    git -C "{=path}" fetch --all --prune
)'''

# Nav Mode Binds (active when mode = "nav")
"nav^^j" = "Down"
"nav^^k" = "Up"
"nav^^down" = "Down"
"nav^^up" = "Up"
"nav^^enter" = "Accept"
"nav^^q" = "Quit"
"nav^^esc" = "Quit"
"nav^^p" = "SwitchPreview"
"nav^^g" = "Pos(0)"
"nav^^G" = "Pos(-1)"

"nav^^c" = '''Execute(
    selected_raw="{=branch}"
    selected_branch=$(echo "$selected_raw" | sed 's/^[ @^]*//; s/ .*//')

