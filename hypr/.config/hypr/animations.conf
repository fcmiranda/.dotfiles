# HyDE Project (Hyprland Desktop Environment) Style
animations {
    enabled = yes

    # Beziers
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1

    # HyDE Window Opening & Closing Animations (Fast HyDE)
    animation = windows, 1, 4, wind, slide
    animation = windowsIn, 1, 4, winIn, slide
    animation = windowsOut, 1, 3, winOut, slide
    animation = windowsMove, 1, 4, wind, slide
    animation = layers, 1, 4, wind, slide
    animation = fade, 1, 10, default
    animation = border, 1, 1, liner
    animation = borderangle, 1, 180, liner, loop
    animation = workspaces, 1, 5, wind
}
