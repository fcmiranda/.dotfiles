[start]
sort = false
ansi = true
reload_interval = 1800

[matcher]
sort_threshold = false

[columns]
split = '\t'
names = [
    { name = "title", ignore = true },
    { name = "idx" },
    { name = "name" },
    { name = "session" },
    { name = "display", ignore = true }
]

[tui]
mouse = true
percentage = 100
max = 9999

[results]
spinner_prefix = "@SPIN@"
spinner_inline = true
current_prefix = ""
unselected_prefix = ""
multi = false
row_connection = "Disjoint"
column_spacing = 0

[results.autoscroll]
enabled = false

[results.border]
sides = ""

[query]
status_inline = true
prompt = " "
show = true

[footer]
content = " {cyan,bold:[Enter]} {darkgray:Switch Window}  •  {green,bold:[c]} {darkgray:New Window}  •  {red,bold:[d]} {darkgray:Kill Window}  •  {blue,bold:[Esc]} {darkgray:Cancel}  •  {magenta,bold:[?]} {darkgray:Toggle Footer}"
row_connection = "Full"
match_indent = false

[ui]
nav_mode = true
nav_focus_on_start = "picker"
nav_bar = "Plain"             # Estilo da barra na lista: "Plain" (│), "Thick" (█), "Double" (║), "Rounded" (│), "QuadrantOutside" (▌), "QuadrantInside" (▐)
nav_color = "black"           # Cor da barra: nomes ("black", "gray", "cyan", "lightblue", etc.) ou hex ("#000000", "#1e1e2e")

[ui.nav_binds]
"c"     = ["ExecuteSilent(printf '%s\\n' '{=}' | $HOME/.config/tmux/window-picker-create.sh)", "@reload"]
"C"     = ["ExecuteSilent(printf '%s\\n' '{=}' | $HOME/.config/tmux/window-picker-create.sh)", "@reload"]
"d"     = ["ExecuteSilent(printf '%s\\n' '{=}' | $HOME/.config/tmux/window-picker-delete.sh)", "@reload"]
"D"     = ["ExecuteSilent(printf '%s\\n' '{=}' | $HOME/.config/tmux/window-picker-delete.sh)", "@reload"]

[ui.border]
sides = ""

[previewer]
debounce_ms = 20
delay_clear = true

[preview]
wrap = false

[preview.border]
sides = "LEFT"
color = "Gray"

[[preview.layout]]
command = 'sess="{=session}"; tmux capture-pane -ep -t "${sess}:{=idx}" 2>/dev/null || printf "  \033[38;2;146;131;116m(no preview)\033[0m\n"'
side = "right"
percentage = 60

[binds]
Start = ["ToggleColumn(title)", "ToggleColumn(name)", "ToggleColumn(session)", "ToggleColumn(idx)"]
"c"     = ["ExecuteSilent(printf '%s\\n' '{=}' | $HOME/.config/tmux/window-picker-create.sh)", "@reload"]
"C"     = ["ExecuteSilent(printf '%s\\n' '{=}' | $HOME/.config/tmux/window-picker-create.sh)", "@reload"]
"d"     = ["ExecuteSilent(printf '%s\\n' '{=}' | $HOME/.config/tmux/window-picker-delete.sh)", "@reload"]
"D"     = ["ExecuteSilent(printf '%s\\n' '{=}' | $HOME/.config/tmux/window-picker-delete.sh)", "@reload"]
"?"     = "ToggleFooter"
"F1"    = "ToggleFooter"
