# Bouncy & Playful Style
animations {
    enabled = yes
    bezier = bounce, 0.68, -0.55, 0.265, 1.55
    bezier = easeOut, 0.0, 0.0, 0.2, 1.0
    animation = windows, 1, 5, bounce, popin
    animation = windowsOut, 1, 4, easeOut, popin 80%
    animation = windowsMove, 1, 4, bounce
    animation = layers, 1, 4, bounce, slide
    animation = fade, 1, 3, easeOut
    animation = border, 1, 3, easeOut
    animation = workspaces, 1, 5, bounce, slide
}
