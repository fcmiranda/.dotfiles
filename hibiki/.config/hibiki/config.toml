display_mode = "keystroke"
position = "bottomcenter"
display_timeout_ms = 2000
max_keys = 5
margin = 20
show_modifiers = true
all_keyboards = true
font_scale = 1.0
opacity = 1.0
font_family = "JetBrainsMono Nerd Font"
font_size = 1.2
keystroke_theme = "system"
keystroke_draggable = false
keystroke_hotkey = "<Shift><Control>k"
pause_hotkey = "<Control>p"
toggle_focus_hotkey = "<Control>b"
auto_detect_layout = true
corner_radius = 1.0

[bubble]
font_family = "JetBrainsMono Nerd Font"
font_size = 1.0
color = "#3584e4"
position = "topright"
draggable = false
hotkey = "<Shift><Control>b"
timeout_ms = 10000
opacity = 1.0
corner_radius = 0.36

[bubble.audio]
enabled = false
volume = 1.0
sound_pack = "cherrymx-blue-abs"

[audio]
enabled = false
volume = 1.0
sound_pack = "cherrymx-blue-abs"
