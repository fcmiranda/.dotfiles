# Hyprland Animation Switcher — Matchmaker preset
# Input is piped from hypr-anim (no shell startup here = instant load)

[ui]
nav_mode = true
nav_bar = "Plain"
nav_color = "Cyan"

[tui]
percentage = 70
min = 12
max = 60

[query]
prompt = " Animations > "
prompt_style.fg = "Cyan"
status_inline = true

[results]
icons = false
wrap = false

[preview]
show = true
wrap = true

[preview.border]
title_fg = "Cyan"
color = "Cyan"
type = "Rounded"

[[preview.layout]]
# bat provides syntax highlighting for hyprlang config files
command = "bat --style=header,grid,numbers --color=always --language=ini {2} 2>/dev/null || cat {2}"
side = "right"
percentage = 65
min = 40

[columns]
split = "\t"
names = [
  "label",
  { name = "path", hidden = true }
]

# Input is piped in by hypr-anim — no command needed here
[start]
mode = "nav"
additional_commands = []

[binds]
"ctrl-j"    = "Down"
"ctrl-k"    = "Up"
"j"         = "Down"
"k"         = "Up"

# nav mode binds
"nav^^enter" = "Accept"
"nav^^q"     = "Quit"
"nav^^esc"   = "Quit"
"nav^^g"     = "Pos(0)"
"nav^^G"     = "Pos(-1)"
"nav^^j"     = "Down"
"nav^^k"     = "Up"
