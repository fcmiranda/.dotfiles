# Matchmaker Agent Worktree Base Branch Preset (`mm -o awt-base`)

[tui]
percentage = 30
min = 10
max = 25
restore_fullscreen = false

[ui]
nav_mode = true
nav_bar = "Plain"
nav_color = "white"

[ui.parent_peek]
enabled = false

[query]
status_inline = false
prompt = "> "
prompt_style.fg = "white"
prompt_style.modifier = "BOLD"

[status]
show = false

[footer]
content = " {cyan,bold:[Enter]} {darkgray:Select Base}  •  {darkgray,bold:[Esc/q]} {darkgray:Back}"
row_connection = "Full"
match_indent = false
style.fg = "gray"
style.modifier = "DIM"

[matcher]
sort = "smart"
typo_tolerance = true

[results]
reverse = false
column_spacing = 2
symlink_target = false

[results.current_style]
bg = "darkgray"
modifier = "BOLD"

[results.current_nav_bar_style]
fg = "cyan"
modifier = "BOLD"

[columns]
split = "\t"
default = "branch"
max_columns = 5
names = [
    { name = "branch" },
    { name = "role" },
    { name = "commit" },
    { name = "raw", hidden = true },
]

[preview]
show = false

[start.command]
command = '''
printf "\033[1;33m main\033[0m\t\033[32mdefault base\033[0m\t%s\tmain\n" "$(git rev-parse --short main 2>/dev/null)"
git branch --format='%(refname:short)' 2>/dev/null | grep -vE '^(main|master)$' | while read -r b; do
    [ -n "$b" ] || continue
    sha=$(git rev-parse --short "$b" 2>/dev/null)
    printf "\033[1;36m %s\033[0m\t\033[2mlocal branch\033[0m\t\033[33m%s\033[0m\t%s\n" "$b" "$sha" "$b"
done
'''

[start]
ansi = true
mode = "nav"
output_template = "{=raw}"

[binds]
"ctrl-j" = "Down"
"ctrl-k" = "Up"
"nav^^j" = "Down"
"nav^^k" = "Up"
"nav^^down" = "Down"
"nav^^up" = "Up"
"nav^^enter" = "Accept"
"nav^^q" = "Quit"
"nav^^esc" = "Quit"
"nav^^g" = "Pos(0)"
"nav^^G" = "Pos(-1)"
