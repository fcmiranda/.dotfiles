# Matchmaker Jump Mode Preset (`mm -o jump`)
# Interactive directory navigation, frecency ranking, and TUI traversal.

[ui]
nav_mode = true
nav_bar = "Plain"
nav_color = "Black"

[matcher]
sort = "smart"
sort_cap = 2000
depth_penalty = 15
frecency = true
frecency_weight = 2
typo_tolerance = true
# Native directory prioritization: puts direct child subfolders at the top of the list
# for instant interactive navigation with 'l' and 'h' without needing multiple fd passes.
dir_first = true

[results]
reverse = false
icons = true
symlink_target = true
symlink_target_style.fg = "cyan"

[results.autoscroll]
indicator = ""
indicator_style.fg = "blue"

[previewer]
debounce_ms = 25
delay_clear = true

[preview]
media = true
media_protocol = "kitty"
media_fit = "crop"
zoom = 1.0

[preview.border]
padding = 0


[[preview.layout]]
command = '''p={1}; p="${p/#\~/$HOME}"; if [ -d "$p" ]; then mm tree "$p" 2>/dev/null || eza --tree --level=2 --icons=always --git-ignore --color=always "$p" 2>/dev/null || ls -la "$p"; else mime=$(file -b --mime-type "$p" 2>/dev/null); if [[ "$mime" == image/* ]]; then if command -v chafa >/dev/null 2>&1; then chafa --format=symbols --symbols=vhalf+hhalf+quad+half+block --color-space=din99d --scale stretch "$p" 2>/dev/null; elif command -v img2txt >/dev/null 2>&1; then img2txt -f ansi -W 60 "$p" 2>/dev/null; fi; echo ""; identify "$p" 2>/dev/null || file "$p"; else bat --style=numbers --color=always --line-range=:300 "$p" 2>/dev/null || cat "$p"; fi; fi'''
side = "right"
percentage = 80

[binds]
"@reloadnext" = "ReloadNext"
"ctrl-z" = "@reloadnext"
"ctrl-j" = "Down"
"ctrl-k" = "Up"
"@ancestor_jump" = '''Transform(
    curr="$(pwd)"
    parents=""
    while [ "$curr" != "/" ] && [ -n "$curr" ]; do
        curr="$(dirname "$curr")"
        parents="$parents $curr"
    done
    if command -v mm >/dev/null 2>&1; then
        target=$(echo "$parents" | tr ' ' '\n' | grep -v '^$' | mm --prompt="Parent > " || true)
        if [ -n "$target" ]; then
            echo "ChDir($target)"
            echo "Reload"
        fi
    fi
)'''

[ui.nav_binds]
"ctrl-z" = "@reloadnext"
"z" = "@reloadnext"
"l" = ["ChDir({=})", "@reload_local"]
"h" = ["ChDir(..)", "@reload_local"]
"alt-u" = "@ancestor_jump"

[breadcrumb]
show = true
separator = "/"
style.fg = "Cyan"
style.modifier = "BOLD"
separator_style.fg = "Cyan"

[start]
# Alternative source commands cycled via @reloadnext (ctrl-z / z in nav_binds):
# Index 0: "" -> Resets back to the main start.command below.
# Index 1: Local file/dir search using fd.
# Index 2: Global frecency directory list from mm list --dirs.
additional_commands = [
    "",
    "fd -H -E.git -Enode_modules -E.cache -Etarget -Edist -Ebuild --strip-cwd-prefix . 2>/dev/null",
    "mm list --dirs 2>/dev/null"
]

[start.command]
command = '''
IGNORE="-E.git -Enode_modules -E.cache -Etarget -Edist -Ebuild -E__pycache__ -E.venv -Evenv -Eenv -Evendor -E.next"

if command -v fd >/dev/null 2>&1; then
    fd -H $IGNORE --strip-cwd-prefix --min-depth 1 --max-depth 1 . 2>/dev/null
    fd -H $IGNORE --strip-cwd-prefix --min-depth 2 . 2>/dev/null
else
    find .
fi
'''
