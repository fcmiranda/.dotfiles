# Matchmaker Downloads Preset (`mm -o downloads`)
# Optimized for browsing ~/Downloads with native terminal image previews

[tui]
percentage = 80
min = 15

[ui]
border = { type = "Rounded" }

[query]
cursor = "none"                  # Hides terminal hardware cursor to prevent Ghostty shader flicker/trails
prompt = "> "
prompt_style.fg = "Cyan"
prompt_style.modifier = "BOLD"

[results]
icons = true
symlink_target = true

[matcher]
sort = "smart"
frecency = true

[preview]
show = true
media = true
media_fit = "fit"
wrap = true
scroll_wrap = true

[previewer]
debounce_ms = 200                # Delay em ms para atualizar o preview ao mover o cursor (ex: 15, 25, 50)
delay_clear = true               # true (evita flicker limpando preview só quando novo estiver pronto) / false

[[preview.layout]]
side = "right"
percentage = 30
min = 25

[start]
directory = "~/Downloads"

[binds]
"ctrl-l" = "@look"
"alt-=" = "ExpandPreview(5)"
"alt-hyphen" = "ShrinkPreview(5)"
"ctrl-/" = "CyclePreview"
