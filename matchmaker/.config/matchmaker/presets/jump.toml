# Matchmaker Jump Mode Preset (`mm -o jump`)
# Interactive directory navigation, frecency ranking, and TUI traversal.

[tui]
percentage = 43               # Altura do TUI em % da tela (descomente para modo inline)

[query]
status_inline = true          # true (contador de resultados na barra de busca) / false
filter_prompt_style.fg = "blue"          # Muda a cor (ex: Yellow, Cyan, #fab387, etc.)
filter_prompt_style.modifier = "BOLD"      # Aplica Negrito ("BOLD", "ITALIC", "DIM", etc.)
filter_underline = true       # Underline aparece quando o filtro está focado e desaparece no modo de navegação
filter_underline_style.fg = "#8999f1" # Cor do underline no foco ("blue", "gray", "cyan", etc.)

# Prompts e cores por modo:
local_prompt = "> "
local_prompt_style.fg = "cyan"
local_underline_style.fg = "cyan"

frecency_prompt = "󱅤 "
frecency_prompt_style.fg = "#8999f1"
frecency_underline_style.fg = "#8999f1"

bookmarks_prompt = " "
bookmarks_prompt_style.fg = "#f9e2af"
bookmarks_underline_style.fg = "#f9e2af"

[ui]
nav_mode = true               # true (modo navegação habilitado) / false
nav_focus_on_start = "picker" # Inicia na lista de resultados (NavBar) para navegação VIM instantânea na Home Row
nav_bar = "Plain"             # Estilo da barra na lista: "Plain" (│), "Thick" (█), "Double" (║), "Rounded" (│), "QuadrantOutside" (▌), "QuadrantInside" (▐)
nav_color = "Darkgray"        # Cor da barra: nomes ("black", "gray", "cyan", "lightblue", etc.) ou hex ("#000000", "#1e1e2e")
# nav_bold = false            # true / false (barra em negrito)
# nav_blink = false           # true / false (barra piscando)
# nav_blink_rate = "Slow"     # "Slow", "Medium", "Fast"
nav_hints = true              # Dicas de atalhos em modo navegação
nav_hints_columns = 4         # Grid de atalhos alinhado em 4 colunas no rodapé (estilo sort menu)

[ui.parent_peek]
enabled = false               # true (mostra painel com pasta pai à esquerda) / false

[ui.parent_peek.border]
show = false                  # true / false (borda do painel pai)

[footer]
# content = "  h/l: Nav  •  Ctrl+F: Cycle Mode  •  Ctrl+P: Toggle Preview  •  Ctrl+U: Ancestors  •  Enter: Select"
style.fg = "gray"             # Cor do texto do rodapé ("gray", "cyan", "#RRGGBB", etc.)
style.modifier = "DIM"        # "DIM", "BOLD", "ITALIC", "UNDERLINED", "REVERSED"
match_indent = false          # true / false

[matcher]
sort = "smart"                # Algoritmo de ordenação: "smart", "score", "exact", "alphabetical", "frecency", "none"
sort_cap = 2000               # Limite máximo de itens a ordenar
depth_penalty = 15            # Penalidade por profundidade de pasta
frecency = true               # true / false (histórico de relevância/frecência)
frecency_weight = 2           # Peso do score de frecência
typo_tolerance = true         # true / false (tolerância a erros de digitação)
dir_first = true              # true / false (prioriza pastas no topo da lista)

[results]
scroll_wrap = true             # true (navegação circular: volta ao início no último item e vice-versa)
tier_separator = "Underline"
# Grossura / tipo de borda do navbar exclusivo para o item focado:
current_nav_bar = "Plain" # "Plain" (│), "Thick" (█), "Double" (║), "Rounded" (│), "QuadrantOutside" (▌), "QuadrantInside" (▐)
max = 15                      # Quantidade máxima de linhas visíveis
reverse = false               # true (ordem de baixo para cima) / false (cima para baixo)
icons = true                  # true (ativa ícones Nerd Font por tipo de arquivo) / false
uncolor_current_icon = true   # true (ícone focado herda cor do foco - estilo Yazi) / false
invert_current_icon = false   # true (inverte cor do ícone no foco: Azul<->Amarelo, Vermelho<->Ciano) / false
row_connection = "Full"       # Destaque da linha: "Full" (barra sólida contínua), "Capped" (somente coluna ativa), "Disjoint" (colunas separadas)
symlink_target = true         # true (mostra '-> destino' em links simbólicos) / false
symlink_target_style.fg = "cyan" # Cor do texto de destino do symlink

bookmark_folder_icon = "󰮟"
bookmark_file_icon = "󱀻"
bookmark_icon_style.fg = "#f9e2af"
frecency_folder_icon = "󰪻"
frecency_folder_icon_style.fg = "#8999f1"
frecency_icon = "󱋢"
frecency_icon_style.fg = "#8999f1"

[results.tier_separator_style]
fg = "#555555"   # ou "Cyan", "Blue", "Gray", "#555555", etc.

# Estilo independente para a célula da barra do navbar no item focado:
[results.current_nav_bar_style]
fg = "white"                 # Cor do glifo da barra focada ("yellow", "cyan", "black", "#89b4fa", etc.)
# bg = "lightblue"            # Cor de fundo da barra focada (se omitido, herda current_style.bg)
# modifier = "BOLD"           # "BOLD", "DIM", "ITALIC", "UNDERLINED"

# Estilo da linha em foco (cursor):
[results.current_style]
fg = "black"                  # Cor do texto no foco: "black", "#000000", "white", "reset", etc.
bg = "Darkgray"              # Cor de fundo do destaque: "lightblue", "gray", "#1e1e2e", "reset" (transparente), etc.
modifier = "BOLD"             # "BOLD", "DIM", "ITALIC", "UNDERLINED", "REVERSED"

# (Opcional) Cor e estilo exclusivos para o glifo do ícone no foco:
# [results.current_icon_style]
# fg = "black"                # Força uma cor de primeiro plano específica apenas para o ícone

[results.autoscroll]
indicator = ""               # Caractere indicador de scroll automático
indicator_style.fg = "blue"   # Cor do indicador de autoscroll

[previewer]
debounce_ms = 200              # Delay em ms para atualizar o preview ao mover o cursor (evita floods em scroll rápido)
delay_clear = true            # true (evita flicker retendo preview anterior até o novo estar pronto)

[preview]
show = true
media = true
media_fit = "fit"
media_size = 0             # Resolução máxima do downscaling em pixels (ex: 512, 800, 1280, 1920; 0 = original/sem downscale)
scrollbar = true

[[preview.layout]]
side = "right"                # Posição do preview: "right", "left", "top", "bottom"
percentage = 60               # Tamanho balanceado do painel em % (Proporção Áurea 60/40)

[binds]
# Modos de dados (ciclar fontes e favoritos)
"tab"           = "@reloadnext"
"shift-backtab" = "@reloadprev"
"backtab"       = "@reloadprev"
"ctrl-f"        = "@dirs"
"ctrl-b"        = "@bookmarks"
"*"             = "@bookmark"

# Foco e modos
"esc"           = "ToggleFocus"

# Navegação do cursor
"ctrl-j"        = "Down"
"ctrl-k"        = "Up"
"alt-j"         = "Down"
"alt-k"         = "Up"

# Navegação de diretórios (entrar / descer)
"ctrl-l"        = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"ctrl-right"    = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"alt-l"         = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]

# Navegação de diretórios (subir / parent)
"ctrl-h"        = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-left"     = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"alt-h"         = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]

# Histórico de ancestrais (subir múltiplos níveis)
"ctrl-u"        = ["Reload(curr=\"$(pwd)\"; while [ \"$curr\" != \"/\" ] && [ -n \"$curr\" ]; do curr=\"$(dirname \"$curr\")\"; echo \"$curr\"; done)", "Cancel", "Pos(0)"]

# Editor, visualização e clipboard
"ctrl-e"        = "Execute(nvim {+})"
"ctrl-p"        = "SwitchPreview"
"ctrl-v"        = "@paste_into"

[ui.nav_binds]
# Modos de dados (ciclar fontes e favoritos)
"tab"           = "@reloadnext"
"shift-backtab" = "@reloadprev"
"backtab"       = "@reloadprev"
"f"             = "@dirs"
"b"             = "@bookmarks"
"*"             = "@bookmark"

# Foco, seleção e saída
"/"             = "FocusFilter"
" "             = "Toggle"
"esc"           = "Quit"
"q"             = "Quit"

# Navegação do cursor
"j"             = "Down"
"k"             = "Up"
"ctrl-j"        = "Down"
"ctrl-k"        = "Up"
"alt-j"         = "Down"
"alt-k"         = "Up"

# Navegação de diretórios (entrar / descer)
"l"             = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"right"         = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"ctrl-l"        = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"ctrl-right"    = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"alt-l"         = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]

# Navegação de diretórios (subir / parent)
"h"             = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"left"          = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"backspace"     = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-h"        = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-left"     = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"alt-h"         = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]

# Histórico de ancestrais (subir múltiplos níveis)
"ctrl-u"        = ["Reload(curr=\"$(pwd)\"; while [ \"$curr\" != \"/\" ] && [ -n \"$curr\" ]; do curr=\"$(dirname \"$curr\")\"; echo \"$curr\"; done)", "Cancel", "Pos(0)"]

# Editor de texto
"e"             = "Execute(nvim {+})"
"ctrl-e"        = "Execute(nvim {+})"

# Operações de arquivo (FM / Clipboard)
"y"             = "@yank"
"x"             = "@cut"
"p"             = "@paste"
"P"             = "@paste_into"
"ctrl-v"        = "@paste_into"
"u"             = "@undo"
"ctrl-r"        = "@redo"

# Menus e painéis
"ctrl-p"        = "SwitchPreview"
","             = "SortMenu"
"\\"            = "ToggleParentPeek"

[breadcrumb]
show = true                   # true (exibe caminho atual como breadcrumb no topo) / false
separator = "/"               # Caractere separador de diretório (ex: "/", " › ", " > ")
style.fg = "Cyan"             # Cor do texto do caminho
style.modifier = "BOLD"       # "BOLD", "DIM", "ITALIC", "UNDERLINED"
separator_style.fg = "Cyan"   # Cor do separador

[start]
# Fontes de dados cicláveis via @reloadnext (ctrl-f / f / b):
# Índice 0: "" -> Usa AsyncWalker nativo para pasta/arquivos locais.
# Índice 1: Lista global de pastas por frecência via mm list --dirs.
# Índice 2: Lista exclusiva de pastas favoritadas via mm list --bookmarks.
additional_commands = [
    "",
    "mm list --dirs 2>/dev/null",
    "mm list --bookmarks 2>/dev/null"
]

[start.command]
command = ""

# Regras automáticas de ordenação por pasta (avaliadas em ordem top-to-bottom)
[[folder_rules]]
path = "~/Downloads"
sort = "ModifiedReverse" # arquivos modificados recentemente primeiro

[[folder_rules]]
path = "*/Downloads"
sort = "ModifiedReverse"

[[folder_rules]]
path = "*/screenshots"
sort = "CreatedReverse"  # capturas de tela criadas recentemente primeiro

[[folder_rules]]
path = "*/Screenshots"
sort = "CreatedReverse"
