[ui]
nav_mode = true
nav_bar = "Plain"
nav_color = "Cyan"

[tui]
percentage = 80
min = 10
max = 100

[preview]
show = true
wrap = true

[preview.border]
title_fg = "Cyan"
color = "Blue"
type = "Rounded"

[[preview.layout]]
command = "if [ -f {2} ]; then cp {2} ~/.config/hypr/animations.conf 2>/dev/null && hyprctl reload >/dev/null 2>&1; bat --paging=never --style=header,grid,numbers --color=always {2} 2>/dev/null || cat {2}; fi"
side = "right"
percentage = 65

[columns]
split = "\t"
names = [
  "label",
  { name = "path", hidden = true }
]

[start.command]
cmd = '''
{
  for file in "$HOME/.config/hypr/animations"/*.conf; do
    [ -f "$file" ] || continue
    filename="${file##*/}"
    title=$(head -n 1 "$file" | sed 's/^# *//')
    if [ -z "$title" ]; then
      title=$(echo "$filename" | sed 's/\.conf$//;s/^[0-9]*[ -]*//;s/-/ /g')
    fi
    printf "%s\t%s\n" "$title" "$file"
  done
}
'''

[query]
prompt = " Hyprland Animations > "

[start]
mode = "nav"
additional_commands = []

[binds]
"ctrl-j" = "Down"
"ctrl-k" = "Up"
"nav^^g" = "Pos(0)"
"nav^^G" = "Pos(-1)"
"nav^^q" = "Quit"
"nav^^esc" = "Quit"
"nav^^enter" = "Accept"
