# Matchmaker Jump Mode Preset (`mm -o jump`)
# Interactive directory navigation, frecency ranking, and TUI traversal.

[tui]
percentage = 70 #height of mm

[query]
status_inline = true

[ui]
nav_mode = true
nav_bar = "Plain"
nav_color = "gray"

[ui.parent_peek]
enabled = false

[ui.parent_peek.border]
show = false

[footer]
# content = "  h/l: Nav  •  Ctrl+F: Cycle Mode  •  Ctrl+P: Toggle Preview  •  Ctrl+U: Ancestors  •  Enter: Select"
style.fg = "gray"
style.modifier = "DIM"
match_indent = false

[matcher]
sort = "smart"
sort_cap = 2000
depth_penalty = 15
frecency = true
frecency_weight = 2
typo_tolerance = true
# Native directory prioritization: puts direct child subfolders at the top of the list
# for instant interactive navigation with 'l' and 'h' without needing multiple fd passes.
dir_first = true

[results]
max = 15
reverse = false
icons = true
uncolor_current_icon = true
row_connection = "Full"
symlink_target = true
symlink_target_style.fg = "cyan"

[results.current_style]
fg = "black"
bg = "lightblue"
modifier = "BOLD"

[results.autoscroll]
indicator = ""
indicator_style.fg = "blue"

[previewer]
debounce_ms = 25
delay_clear = true

[preview]
media = true
media_protocol = "kitty"

[preview.border]
# title_fg = "cyan"
# color = "blue"
# type = "Rounded"   
padding = 0


[[preview.layout]]
command = '''p={1}; p="${p/#\~/$HOME}"; if [ -d "$p" ]; then mm tree "$p" 2>/dev/null || eza --tree --level=2 --icons=always --git-ignore --color=always "$p" 2>/dev/null || ls -la "$p"; else mime=$(file -b --mime-type "$p" 2>/dev/null); if [[ "$mime" == image/* ]]; then if command -v chafa >/dev/null 2>&1; then chafa --format=symbols --symbols=vhalf+hhalf+quad+half+block --color-space=din99d --scale stretch "$p" 2>/dev/null; elif command -v img2txt >/dev/null 2>&1; then img2txt -f ansi -W 60 "$p" 2>/dev/null; fi; echo ""; identify "$p" 2>/dev/null || file "$p"; else bat --style=numbers --color=always --line-range=:300 "$p" 2>/dev/null || cat "$p"; fi; fi'''
side = "right"
percentage = 80
max = 10

[binds]
"@reloadnext" = "ReloadNext"
"ctrl-f" = "@reloadnext"
"ctrl-j" = "Down"
"ctrl-k" = "Up"
"ctrl-p" = "SwitchPreview"
"ctrl-l" = ["ChDir({=})", "Cancel", "Reload", "Pos(0)"]
"ctrl-h" = ["ChDir(..)", "Cancel", "Reload", "Pos(0)"]
"ctrl-u" = ["Reload(curr=\"$(pwd)\"; while [ \"$curr\" != \"/\" ] && [ -n \"$curr\" ]; do curr=\"$(dirname \"$curr\")\"; echo \"$curr\"; done)", "Cancel", "Pos(0)"]

[ui.nav_binds]
"f" = "@reloadnext"
"l" = ["ChDir({=})", "Cancel", "Reload", "Pos(0)"]
"h" = ["ChDir(..)", "Cancel", "Reload", "Pos(0)"]
"ctrl-l" = ["ChDir({=})", "Cancel", "Reload", "Pos(0)"]
"ctrl-h" = ["ChDir(..)", "Cancel", "Reload", "Pos(0)"]
"ctrl-p" = "SwitchPreview"
"u" = ["Reload(curr=\"$(pwd)\"; while [ \"$curr\" != \"/\" ] && [ -n \"$curr\" ]; do curr=\"$(dirname \"$curr\")\"; echo \"$curr\"; done)", "Cancel", "Pos(0)"]
"ctrl-u" = ["Reload(curr=\"$(pwd)\"; while [ \"$curr\" != \"/\" ] && [ -n \"$curr\" ]; do curr=\"$(dirname \"$curr\")\"; echo \"$curr\"; done)", "Cancel", "Pos(0)"]

[breadcrumb]
show = true
separator = "/"
style.fg = "Cyan"
style.modifier = "BOLD"
separator_style.fg = "Cyan"

[start]
# Alternative source commands cycled via @reloadnext (ctrl-r):
# Index 0: "" -> Uses native AsyncWalker for local directory/files.
# Index 1: Global frecency directory list from mm list --dirs.
additional_commands = [
    "",
    "mm list --dirs 2>/dev/null"
]

[start.command]
command = ""
