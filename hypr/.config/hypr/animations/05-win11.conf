# Windows 11 Fluent Style
animations {
    enabled = yes
    bezier = fluent, 0.0, 0.0, 0.0, 1.0
    bezier = fluentOut, 1.0, 0.0, 1.0, 1.0
    animation = windows, 1, 3, fluent, popin 95%
    animation = windowsOut, 1, 2, fluentOut, popin 95%
    animation = windowsMove, 1, 3, fluent
    animation = layers, 1, 3, fluent, slide
    animation = fade, 1, 2, fluent
    animation = border, 1, 4, fluent
    animation = workspaces, 1, 3, fluent, slidefade 10%
}
