[ui]
nav_mode = true
nav_bar = "Plain"
nav_color = "Black"

[matcher]
sort = "smart"
depth_penalty = 15
frecency = true
frecency_weight = 2
typo_tolerance = true

[results]
reverse = false
icons = true
symlink_target = true
symlink_target_style.fg = "cyan"
dim_directory_path = true
directory_path_style.fg = "dark_gray"

[results.autoscroll]
indicator = ""
indicator_style.fg = "blue"

[preview]
media = true

[preview.border]
title_fg = "cyan"
color = "blue"
type = "Rounded"

[[preview.layout]]
command = "p={1}; p=\"${p/#\\~/$HOME}\"; if [ -d \"$p\" ]; then eza --tree --level=2 --icons --color=always \"$p\"; else bat --style=numbers --color=always --line-range=:300 \"$p\"; fi"
side = "right"
percentage = 80

[binds]
"@reloadnext" = "ReloadNext"
"ctrl-z" = "@reloadnext"
"ctrl-j" = "Down"
"ctrl-k" = "Up"

[ui.nav_binds]
"ctrl-z" = "@reloadnext"
"z" = "@reloadnext"
"l" = ["ChDir({=})", "@reload_local"]
"h" = ["ChDir(..)", "@reload_local"]

[breadcrumb]
show = true
separator = "/"
style.fg = "Cyan"
style.modifier = "BOLD"
separator_style.fg = "Cyan"
#current_folder_only = true
#truncate_length = 3
#width_pct = 80

[start]
additional_commands = [
    "",
    "fd -H -E.git -Enode_modules -E.cache -Etarget -Edist -Ebuild --strip-cwd-prefix . 2>/dev/null",
    "mm list 2>/dev/null"
]

[start.command]
command = '''
IGNORE="-E.git -Enode_modules -E.cache -Etarget -Edist -Ebuild -E__pycache__ -E.venv -Evenv -Eenv -Evendor -E.gradle -E.npm -E.pnpm-store -E.next -Eout -Ecoverage -E.tox -E.mypy_cache -E.pytest_cache -E.cargo -E.rustup -E.mozilla -E.thunderbird"

if [ "$PWD" = "$HOME" ]; then
    {
        # Onda 1: Diretórios rastreados por Frecency (no topo)
        mm list 2>/dev/null
        # Onda 2: Conteúdo interno dos diretórios de alta frecência (profundidade 2)
        mm list 2>/dev/null | while IFS= read -r zd; do [ -d "$zd" ] && fd -td -H $IGNORE --max-depth 2 . "$zd" 2>/dev/null; done
        # Onda 3: Demais diretórios da Home (profundidade 3)
        fd -td -H $IGNORE --max-depth 3 . "$HOME" 2>/dev/null
    } | awk '!seen[$0]++'
else
    if command -v fd >/dev/null 2>&1; then
        fd -td -H $IGNORE --strip-cwd-prefix --print0 --max-depth 1 . 2>/dev/null
        fd -tf -H $IGNORE --strip-cwd-prefix --print0 --max-depth 1 . 2>/dev/null
        fd -H $IGNORE --strip-cwd-prefix --print0 --min-depth 2 . 2>/dev/null
    else
        find . -print0
    fi
fi
'''